schema: 1
rules:
  - id: browsers.chrome.cache
    name: Chrome cache
    category: browsers
    risk: safe
    default_enabled: true
    requires_closed: [chrome.exe]
    targets:
      - path: '%LOCALAPPDATA%\Google\Chrome\User Data\*\Cache'
        mode: contents
      - path: '%LOCALAPPDATA%\Google\Chrome\User Data\*\Code Cache'
        mode: contents
