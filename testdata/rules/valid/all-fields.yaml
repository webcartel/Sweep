schema: 1
rules:
  - id: user.everything
    name: Every field
    description: Exercises every field of the rule format
    category: user
    risk: moderate
    default_enabled: true
    tags: [dev, extra]
    requires_admin: true
    requires_closed: [foo.exe, bar.exe]
    os_min_build: 17763
    trash: true
    targets:
      - kind: command
        cmd: powershell.exe
        args: ['-NoProfile', '-Command', 'Clear-RecycleBin -Force']
      - path: '%USERPROFILE%\Downloads'
        mode: self
        include: ['*.exe', '*.msi']
        exclude: ['keep-*.exe']
        min_age_days: 30
        min_size: 5MB
      - path: '%TEMP%'
