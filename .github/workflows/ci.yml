name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: build, vet, test, lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # Pinned on purpose: the lint result is a gate, and `latest` lets a new
      # golangci-lint release redden an untouched commit. v2.15.0 is the
      # version that runs clean on this tree.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  linux:
    name: core packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./internal/model/... ./internal/rules/...
      - run: go test ./internal/model/... ./internal/rules/...
