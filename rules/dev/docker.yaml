schema: 1
rules:
  - id: dev.docker-prune
    name: Docker system prune
    description: Docker removes stopped containers and dangling images. Protects itself against a wrong answer, but the containers do not come back, so ask for it by name.
    category: dev
    risk: dangerous
    tags: [dev]
    targets:
      - kind: command
        cmd: docker
        args: ['system', 'prune', '-f']
