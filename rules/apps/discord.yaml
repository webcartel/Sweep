schema: 1
rules:
  - id: apps.discord.cache
    name: Discord cache
    description: Discord's cache of pictures, sounds and scripts. Discord rebuilds it, so the first start is slower once.
    category: apps
    risk: safe
    default_enabled: true
    requires_closed: [Discord.exe]
    targets:
      - path: '%APPDATA%\discord\Cache'
        mode: contents
      - path: '%APPDATA%\discord\Code Cache'
        mode: contents
      - path: '%APPDATA%\discord\GPUCache'
        mode: contents
