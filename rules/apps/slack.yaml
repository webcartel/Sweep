schema: 1
rules:
  - id: apps.slack.cache
    name: Slack cache
    description: Slack's cache of pictures and scripts. Slack rebuilds it, so the first start is slower once.
    category: apps
    risk: safe
    default_enabled: true
    requires_closed: [slack.exe]
    targets:
      - path: '%APPDATA%\Slack\Cache'
        mode: contents
      - path: '%APPDATA%\Slack\Code Cache'
        mode: contents
      - path: '%APPDATA%\Slack\GPUCache'
        mode: contents
